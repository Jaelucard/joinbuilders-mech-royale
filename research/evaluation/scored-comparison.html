<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scored source comparison</title><style>:root{font-family:var(--font-sans);color:var(--foreground)}*{box-sizing:border-box}body{margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;padding:16px;background:var(--card);border-radius:var(--radius)}figcaption{font-weight:650;font-size:14px}.sub{font-size:12px;line-height:1.4;color:var(--muted-foreground);min-height:34px;margin:8px 0 12px}.plot{height:160px}.row{height:40px}.label{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:20px}.track{height:7px;border-radius:4px;background:var(--secondary)}.bar{height:7px;border-radius:4px}.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted-foreground)}.note{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:12px 0 0}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="grid"><figure><figcaption>Official scores</figcaption><p class="sub">User-confirmed score-to-commit mapping.</p><div class="plot"><div class="row"><div class="label"><span>V3 / 411af5f</span><b>4.81</b></div><div class="track"><div class="bar" style="width:32.066667%;background:var(--chart-1)"></div></div></div><div class="row"><div class="label"><span>V4 / 5b783d1</span><b>4.65</b></div><div class="track"><div class="bar" style="width:31.000000%;background:var(--chart-4)"></div></div></div></div><div class="axis"><span>0</span><span>Placement points</span><span>15</span></div></figure><figure><figcaption>Local diagnostic only</figcaption><p class="sub">48 matched practice seeds; environment geometry held fixed.</p><div class="plot"><div class="row"><div class="label"><span>V3</span><b>5.417</b></div><div class="track"><div class="bar" style="width:36.111111%;background:var(--chart-1)"></div></div></div><div class="row"><div class="label"><span>Terrain change only</span><b>5.229</b></div><div class="track"><div class="bar" style="width:34.861111%;background:var(--chart-2)"></div></div></div><div class="row"><div class="label"><span>Canopy change only</span><b>5.521</b></div><div class="track"><div class="bar" style="width:36.805556%;background:var(--chart-3)"></div></div></div><div class="row"><div class="label"><span>V4 (both changes)</span><b>5.312</b></div><div class="track"><div class="bar" style="width:35.416667%;background:var(--chart-4)"></div></div></div></div><div class="axis"><span>0</span><span>Placement points</span><span>15</span></div></figure></div><p class="note">Official and local score levels are not comparable. All local paired confidence intervals include no change. Geometry witnesses make terrain precision the stronger suspect; neither the proxy nor aggregate official scores prove the cause.</p></body></html>
